[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/mathis-ait/kaleido"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
kaleido-formats = { path = "crates/formats" }
kaleido-core = { path = "crates/core" }

# Le moteur manipule des ROMs de plusieurs centaines de Mo : on l'optimise même en développement.
[profile.dev.package.kaleido-formats]
opt-level = 2

# SHA-256 de RomFS de plusieurs Go (reconstruction des images 3DS).
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.kaleido-core]
opt-level = 2

# Décodage AAC des musiques de X/Y (aperçu sonore de la bibliothèque).
[profile.dev.package.symphonia-codec-aac]
opt-level = 2

[profile.dev.package.symphonia-core]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
