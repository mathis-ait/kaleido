[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/thisma/kaleido"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
kaleido-formats = { path = "crates/formats" }
kaleido-core = { path = "crates/core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
